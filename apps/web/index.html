<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%GAME_NAME%</title>
    <meta name="description" content="%GAME_NAME%: a 2.5D jetpack shooter in your browser. Open the link, pick a name, you're in the room." />
    <meta name="theme-color" content="#0f141c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- link previews (chat apps, social): %ORIGIN% is this site's public address, filled in when served -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%GAME_NAME%" />
    <meta property="og:title" content="%GAME_NAME%: jump in and play" />
    <meta property="og:description" content="A 2.5D jetpack shooter in your browser. Open the link, pick a name, and you're in the room with your friends." />
    <meta property="og:image" content="%ORIGIN%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%GAME_NAME%: soldiers with jetpacks on a city rooftop map" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- the owner's design kit (its fonts, tokens, components): before any script, so the loading screen has them -->
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <link rel="stylesheet" href="/src/ui/kit.css" />
    <!-- round one's components for the screens not ported to round two yet (each phase shrinks it) -->
    <link rel="stylesheet" href="/src/ui/kit-v1.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
      #game, #view3d { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: none; }
      #perf3d { position: fixed; right: 8px; bottom: 8px; margin: 0; padding: 4px 8px; background: rgba(13,17,23,.7); border-radius: 4px; font-size: 11px; pointer-events: none; white-space: pre; }
      #bar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(13,17,23,.8); padding: 4px 8px; border-radius: 6px; border: 1px solid #30363d; }
      #bar:empty { display: none; }
      #bar a, #bar button { color: #e6edf3; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 3px 8px; text-decoration: none; font: inherit; cursor: pointer; }
      #bar a.active { background: #1f6feb; border-color: #1f6feb; }
      #bar .maps { display: flex; gap: 4px; align-items: center; color: #8b949e; margin-left: 6px; }
      #panel { position: fixed; top: 8px; right: 8px; width: 290px; max-height: calc(100vh - 16px); overflow-y: auto; }
      #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #da3633; padding: 6px 12px; border-radius: 6px; display: none; }
      /* the loading screen (the kit's 13 · Loading, kit.css): plain HTML, so it shows before the app's
         scripts arrive on a slow link; boot.js fits it to the window and turns the tips */
      #boot-splash { position: fixed; inset: 0; z-index: 50; background: var(--c-ink-900); transition: opacity 0.35s; }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
      #boot-splash .mf-fit { position: fixed; inset: 0; overflow: hidden; }
      #boot-splash .screen { width: var(--fit-w, 1920px); height: var(--fit-h, 1080px); zoom: var(--fit, 1); background: var(--c-ink-900); }
      .mf-boot__bar > i { --x: 0.4; animation: mf-boot-slide 1.1s ease-in-out infinite; }
      .mf-boot__slow { opacity: 0; animation: mf-boot-show 0.4s 20s forwards; }
      @keyframes mf-boot-slide { from { transform: translateX(-40%) scaleX(0.4); } to { transform: translateX(100%) scaleX(0.4); } }
      @keyframes mf-boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .mf-boot__bar > i { --x: 1; animation: none; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="mf" role="status" aria-label="Loading">
      <div class="mf-fit kit-v1">
        <section class="screen screen--game" data-screen="loading" data-active-state="tip-1">
          <div class="loading__shade" aria-hidden="true"></div>
          <div class="loading">
            <div class="loading__map">
              <p class="eyebrow">Loading</p>
              <h1 class="loading__name display">Gearing up</h1>
              <p class="loading__rules" id="boot-room" hidden><span>Joining room <b class="num" id="boot-code"></b></span></p>
              <div class="loading__progress">
                <div class="bar bar--load mf-boot__bar" aria-hidden="true"><i></i></div>
                <p class="loading__step"><span>Loading the game…</span></p>
                <p class="loading__step mf-boot__slow"><span>Still loading: a slow connection? Keep this tab open, or reload.</span></p>
                <noscript><p class="loading__step"><span>This game needs JavaScript turned on.</span></p></noscript>
              </div>
            </div>
            <div class="tip hud-plate">
              <p class="tip__head"><span class="eyebrow">Tip</span><span class="tip__dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
              <div class="tip__body" data-state="tip-1"><span class="tip__icon"><svg class="ic ic--xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V7M6.5 12.5L12 7l5.5 5.5"/><path d="M4 3.5h16"/></svg></span><p>Hold jet to fly. Fuel refills on the ground, faster than in the air.</p></div>
              <div class="tip__body" data-state="tip-2" hidden><span class="tip__icon"><svg class="ic ic--xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13M6.5 11.5L12 17l5.5-5.5"/><path d="M4 20.5h16"/></svg></span><p>Hold crouch on a yellow platform to drop through it.</p></div>
              <div class="tip__body" data-state="tip-3" hidden><span class="tip__icon"><svg class="ic ic--xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3v6.2c0 4.8-3.4 8.7-8 9.8-4.6-1.1-8-5-8-9.8V5.5z"/><path d="M8.5 9h7"/></svg></span><p>Sling your riot shield to cover your back.</p></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="/boot.js"></script>
    <canvas id="view3d"></canvas>
    <canvas id="game"></canvas>
    <div id="bar"></div>
    <div id="panel"></div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
